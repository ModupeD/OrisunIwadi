[project]
name = "orisun-iwadi"
version = "0.1.0"
description = "OrisunIwadi: idempotent data platform for public cancer research datasets (Dagster, S3, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "requests",
    "boto3",
    "psycopg[binary,pool]>=3.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orisun_iwadi"]

[tool.dagster]
module_name = "orisun_iwadi.entrypoints.dagster.definitions"
code_location_name = "oncolake"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
