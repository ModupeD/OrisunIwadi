[project]
name = "orisun-iwadi"
version = "0.1.0"
description = "OrisunIwadi: idempotent data platform for public cancer research datasets (Dagster, S3, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "requests",
    "boto3",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orisun_iwadi"]

[tool.dagster]
module_name = "orisun_iwadi.entrypoints.dagster.definitions"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
