# Checkov (Terraform security scanner) settings: uvx checkov -d infra
# Each skipped check is a deliberate trade-off for a low-cost portfolio deployment, with the
# reason. Everything else must pass.
framework: [terraform]
compact: true
quiet: true
skip-check:
  # Encryption with customer-managed KMS keys (~$1/key/month each, plus key policies to manage).
  # Everything is still encrypted at rest with AWS-managed keys.
  - CKV_AWS_145  # S3 KMS
  - CKV_AWS_136  # ECR KMS
  - CKV_AWS_149  # Secrets Manager CMK
  - CKV_AWS_158  # CloudWatch Logs KMS
  - CKV_AWS_297  # Scheduler CMK
  - CKV_AWS_26   # SNS encryption (alerts contain no data; EventBridge can't use the AWS-managed key)
  # Extra copies and logs that cost more than they're worth here.
  - CKV_AWS_144  # S3 cross-region replication (raw files can be re-fetched from the sources)
  - CKV_AWS_18   # S3 server access logs (CloudTrail already records who did what)
  - CKV2_AWS_62  # S3 event notifications (nothing needs them)
  - CKV_AWS_91   # load balancer access logs (WAF metrics + API logs cover requests)
  - CKV_AWS_338  # 1-year log retention (30 days is enough for this project)
  - CKV_AWS_65   # ECS Container Insights (extra cost; service metrics + alarms are enough)
  - CKV_AWS_118  # RDS enhanced monitoring (extra cost; basic metrics + alarms are enough)
  - CKV_AWS_353  # RDS Performance Insights (not needed at this size)
  # Choices made with a variable or by design.
  - CKV_AWS_157  # RDS Multi-AZ: on when high_availability = true
  - CKV_AWS_2    # HTTPS: on when certificate_arn is set (needs a domain)
  - CKV_AWS_378  # load balancer -> tasks is HTTP inside the private network
  - CKV_AWS_161  # RDS IAM auth: apps use passwords from Secrets Manager instead
  - CKV2_AWS_57  # automatic secret rotation: rotate with secrets_version (see secrets.tf)
  - CKV2_AWS_5   # etl/admin security groups are attached when tasks start (scheduler, run-task)
  - CKV_AWS_394  # the first two available zones are used; more zones appearing changes nothing
  - CKV2_AWS_31  # full WAF request logs (extra cost; sampled requests + metrics are kept)
  - CKV2_AWS_76  # false positive: AWSManagedRulesKnownBadInputsRuleSet (Log4j) is attached
